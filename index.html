<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#166534">
<meta name="description" content="Calendario de lotes julianos y vencimientos configurables">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>LoteSUB</title>
<style>
:root{color-scheme:light;--bg:#eef6f1;--bg2:#f7faf8;--card:#ffffff;--card2:#f3f8f5;--text:#163229;--muted:#60766d;--line:#d4e3da;--accent:#166534;--accent2:#15803d;--accentText:#fff;--soft:#e2f3e8;--softText:#14532d;--hero1:#166534;--hero2:#0f5132;--shadow:0 14px 36px rgba(20,83,45,.10);--today:#16a34a;--todayRing:rgba(22,163,74,.15);--weekend:#f6faf7;--toast:#163229}
html[data-theme="dark"]{color-scheme:dark;--bg:#07150f;--bg2:#0b1c14;--card:#10251a;--card2:#132c1f;--text:#edf8f1;--muted:#a3b9ab;--line:#294535;--accent:#4ade80;--accent2:#22c55e;--accentText:#06210f;--soft:#173d27;--softText:#a7f3d0;--hero1:#14532d;--hero2:#0b3d24;--shadow:0 16px 40px rgba(0,0,0,.30);--today:#4ade80;--todayRing:rgba(74,222,128,.14);--weekend:#0d2117;--toast:#e7f6ec}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 90% 0,rgba(34,197,94,.10),transparent 30%),linear-gradient(180deg,var(--bg2),var(--bg));transition:background .2s,color .2s}.app{width:min(1220px,calc(100% - 32px));margin:auto;padding:24px 0 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:13px}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--accentText);background:linear-gradient(145deg,var(--accent),var(--accent2));font-weight:900;letter-spacing:-.04em;box-shadow:0 10px 24px rgba(22,101,52,.22)}h1,h2,p{margin:0}h1{font-size:clamp(1.45rem,3vw,2rem);line-height:1.05;letter-spacing:-.025em}.brand p,.sub,.detail,footer{color:var(--muted)}.brand p{margin-top:4px;font-size:.92rem}.topActions{display:flex;align-items:center;gap:9px}.status,.label,.week{color:var(--softText);background:var(--soft);font-weight:800}.status{padding:9px 12px;border-radius:999px;font-size:.82rem;white-space:nowrap}.theme{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:800;box-shadow:0 5px 16px rgba(0,0,0,.04)}.summary{display:grid;grid-template-columns:1.55fr repeat(3,minmax(0,1fr));gap:15px;margin-bottom:18px}.hero,.metric,.panel{border-radius:24px}.hero{min-height:190px;padding:28px;color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:230px;height:230px;border:38px solid rgba(255,255,255,.07);border-radius:50%;right:-85px;top:-100px}.hero>*{position:relative;z-index:1}.hero small{opacity:.8;text-transform:uppercase;letter-spacing:.13em;font-weight:800}.hero strong{display:block;font-size:clamp(2.3rem,6vw,4.3rem);line-height:1;margin:12px 0 10px;letter-spacing:-.045em}.hero p{opacity:.9}.metric{min-height:190px;padding:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 26px rgba(20,83,45,.06)}.label{display:inline-block;padding:8px 11px;margin-bottom:22px;border-radius:11px;font-size:.84rem}.metric>strong{display:block;font-size:clamp(1.8rem,3.8vw,2.55rem);line-height:1.05;letter-spacing:-.035em;font-variant-numeric:tabular-nums}.detail{margin-top:10px;font-size:.82rem;line-height:1.4}.panel{background:var(--card);border:1px solid var(--line);padding:22px;box-shadow:var(--shadow)}.calhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:center}.calhead h2{font-size:clamp(1.25rem,2.5vw,1.65rem);text-transform:capitalize;letter-spacing:-.02em}.sub{margin-top:4px;font-size:.84rem}.nav,.btn{border:0;border-radius:12px;cursor:pointer;font-weight:800;transition:transform .15s,background .15s}.nav:hover,.btn:hover,.theme:hover{transform:translateY(-1px)}.nav{width:44px;height:44px;font-size:1.45rem;color:var(--softText);background:var(--soft)}.tools{display:flex;justify-content:center;align-items:end;gap:10px;flex-wrap:wrap;margin:18px 0}.days{display:grid;gap:5px;color:var(--muted);font-size:.76rem;font-weight:800}.days span{min-height:42px;display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}.days input{width:66px;border:0;outline:0;background:transparent;color:var(--text);font-weight:900;font-size:1rem}.btn{min-height:42px;padding:10px 15px;color:var(--accentText);background:var(--accent)}.btn.alt{color:var(--softText);background:var(--soft)}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekdays b{text-align:center;padding:7px 4px;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}.day{min-height:132px;padding:11px;border:1px solid var(--line);border-radius:16px;background:var(--card);transition:transform .15s,border-color .15s,box-shadow .15s}.day:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 9px 22px rgba(20,83,45,.09)}.day:nth-child(7n),.day:nth-child(7n-1){background:var(--weekend)}.day.empty{border-color:transparent;background:transparent;box-shadow:none}.day.today{border:2px solid var(--today);box-shadow:0 0 0 4px var(--todayRing)}.daytop,.row,footer{display:flex;justify-content:space-between;gap:7px}.daytop>strong{font-size:1.08rem}.week{padding:4px 7px;border-radius:999px;font-size:.67rem}.info{display:grid;gap:9px;margin-top:14px}.row{align-items:end;color:var(--muted);font-size:.72rem}.row strong{color:var(--text);font-size:clamp(.95rem,1.5vw,1.12rem);font-weight:900;letter-spacing:.015em;font-variant-numeric:tabular-nums}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);background:var(--toast);color:var(--card);padding:11px 15px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}footer{margin-top:16px;font-size:.8rem}
@media(max-width:980px){.app{width:min(100% - 24px,1220px)}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-column:1/-1;min-height:175px}.metric{min-height:165px}.day{min-height:118px;padding:9px}.row strong{font-size:1rem}}
@media(max-width:700px){.app{width:min(100% - 16px,1220px);padding:15px 0 28px}.top{align-items:flex-start}.status{display:none}.theme{padding:8px 10px}.summary{grid-template-columns:1fr;gap:10px}.hero,.metric{min-height:auto}.hero{padding:22px}.metric{padding:18px}.label{margin-bottom:15px}.panel{padding:12px;border-radius:19px}.calhead{gap:7px}.nav{width:39px;height:39px}.tools{margin:14px 0}.weekdays,.grid{gap:4px}.weekdays b{font-size:.64rem;padding:5px 1px;letter-spacing:0}.day{min-height:104px;padding:7px;border-radius:12px}.daytop>strong{font-size:.95rem}.week{padding:3px 5px;font-size:.58rem}.info{gap:7px;margin-top:10px}.row{display:grid;gap:1px;font-size:.6rem}.row strong{font-size:.82rem;line-height:1.1}.days{width:100%}.days span{justify-content:center}.btn{flex:1 1 150px}footer{align-items:flex-start;flex-direction:column}}
@media(max-width:410px){.brand p{display:none}.logo{width:44px;height:44px;border-radius:13px}.theme{font-size:.78rem}.day{min-height:96px;padding:6px}.row strong{font-size:.74rem}.row span{font-size:.56rem}.calhead .sub{display:none}}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand"><div class="logo">LS</div><div><h1>LoteSUB</h1><p>Consulta diaria y calendario de lotes julianos</p></div></div><div class="topActions"><span class="status">Datos automáticos</span><button class="theme" id="theme" type="button" aria-label="Cambiar modo de color">Modo oscuro</button></div></header>
<section class="summary"><article class="hero"><small>Fecha de hoy</small><strong id="today">--/--/----</strong><p id="todayLong">Cargando…</p></article><article class="metric"><span class="label">Lote del día</span><strong id="lot">---/--</strong><p class="detail" id="lotDetail"></p></article><article class="metric"><span class="label">Semana del año</span><strong id="week">--</strong><p class="detail">Semana ISO</p></article><article class="metric"><span class="label">Fecha de vencimiento</span><strong id="expiry">--/--/----</strong><p class="detail" id="expiryDetail"></p></article></section>
<section class="panel"><div class="calhead"><button class="nav" id="prev" aria-label="Mes anterior">‹</button><div><h2 id="title">Mes actual</h2><p class="sub">Lote, vencimiento y semana ISO</p></div><button class="nav" id="next" aria-label="Mes siguiente">›</button></div><div class="tools"><label class="days">Días para vencimiento<span><input id="days" type="number" min="0" max="999" value="15"> días corridos</span></label><button class="btn alt" id="now">Volver al mes actual</button><button class="btn" id="copy">Copiar datos de hoy</button></div><div class="weekdays"><b>Lun</b><b>Mar</b><b>Mié</b><b>Jue</b><b>Vie</b><b>Sáb</b><b>Dom</b></div><div class="grid" id="grid"></div><footer><span id="summary"></span><span id="updated"></span></footer></section></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),pad=(n,l=2)=>String(n).padStart(l,'0'),fmt=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`,short=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${pad(d.getFullYear()%100)}`;
function setTheme(mode){document.documentElement.dataset.theme=mode;try{localStorage.setItem('lotesub-theme',mode)}catch{}$('theme').textContent=mode==='dark'?'Modo claro':'Modo oscuro';$('themeColor').setAttribute('content',mode==='dark'?'#0b3d24':'#166534')}
let initialTheme='light';try{initialTheme=localStorage.getItem('lotesub-theme')||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}catch{}setTheme(initialTheme);$('theme').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
function doy(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000)}function week(d){const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),x=u.getUTCDay()||7;u.setUTCDate(u.getUTCDate()+4-x);return Math.ceil((((u-new Date(Date.UTC(u.getUTCFullYear(),0,1)))/86400000)+1)/7)}function lot(d){return `${pad(doy(d),3)}-${pad(d.getFullYear()%100)}`}function saved(){try{const n=+localStorage.getItem('lotesub-days');return Number.isInteger(n)&&n>=0&&n<=999?n:15}catch{return 15}}let days=saved(),today=new Date(),view=new Date(today.getFullYear(),today.getMonth(),1),data;today=new Date(today.getFullYear(),today.getMonth(),today.getDate());$('days').value=days;
function calc(){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate()),e=new Date(d);e.setDate(e.getDate()+days);data={date:fmt(d),lot:lot(d),week:pad(week(d)),expiry:fmt(e)};$('today').textContent=data.date;$('todayLong').textContent=new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);$('lot').textContent=data.lot;$('lotDetail').textContent=`Día juliano ${pad(doy(d),3)} · año ${d.getFullYear()}`;$('week').textContent=data.week;$('expiry').textContent=data.expiry;$('expiryDetail').textContent=`${days} ${days===1?'día corrido':'días corridos'} desde la fecha actual`;$('updated').textContent=`Actualizado ${n.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`}
function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),lead=(first.getDay()+6)%7,g=$('grid');g.innerHTML='';$('title').textContent=new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(view);$('summary').textContent=`${last.getDate()} días · semanas ${pad(week(first))} a ${pad(week(last))}`;for(let i=0;i<lead;i++){const x=document.createElement('div');x.className='day empty';g.appendChild(x)}for(let n=1;n<=last.getDate();n++){const d=new Date(y,m,n),e=new Date(d);e.setDate(e.getDate()+days);const x=document.createElement('article');x.className='day'+(d.toDateString()===today.toDateString()?' today':'');x.setAttribute('aria-label',`${fmt(d)}, lote ${lot(d)}, vencimiento ${short(e)}, semana ${pad(week(d))}`);x.innerHTML=`<div class="daytop"><strong>${n}</strong><span class="week">S${pad(week(d))}</span></div><div class="info"><div class="row"><span>Lote</span><strong>${lot(d)}</strong></div><div class="row"><span>Venc.</span><strong>${short(e)}</strong></div></div>`;g.appendChild(x)}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function apply(){let n=parseInt($('days').value,10);days=Number.isInteger(n)?Math.min(999,Math.max(0,n)):15;$('days').value=days;try{localStorage.setItem('lotesub-days',days)}catch{}calc();render();toast('Vencimiento actualizado')}$('days').addEventListener('change',apply);$('days').addEventListener('keydown',e=>{if(e.key==='Enter'){apply();e.currentTarget.blur()}});$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('now').onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);render()};$('copy').onclick=async()=>{calc();const t=`Fecha de hoy: ${data.date}\nLote del día: ${data.lot}\nSemana del año: ${data.week}\nFecha de vencimiento: ${data.expiry}\nDías configurados: ${days}`;try{await navigator.clipboard.writeText(t);toast('Datos copiados')}catch{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Datos copiados')}};calc();render();setInterval(calc,60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
