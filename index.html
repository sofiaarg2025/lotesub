<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><meta name="description" content="Calendario de lotes julianos y vencimientos configurables"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>LoteSUB</title>
<style>
:root{color-scheme:light dark;--bg:#f3f6f7;--card:#fff;--text:#17212b;--muted:#687985;--line:#dce5e8;--accent:#0f766e;--soft:#e5f4f2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:linear-gradient(180deg,#edf4f5,var(--bg));min-height:100vh}.app{width:min(1180px,calc(100% - 20px));margin:auto;padding:18px 0 32px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--accent);font-weight:800}h1,h2,p{margin:0}.brand p,.sub,.detail,footer{color:var(--muted)}.status,.label,.week{color:#0b5f59;background:var(--soft);border-radius:999px;font-weight:700}.status{padding:8px 11px;font-size:.85rem}.summary{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:14px;margin-bottom:16px}.hero,.metric,.panel{border-radius:22px}.hero{padding:26px;color:#fff;background:linear-gradient(135deg,#0f766e,#0c6270)}.hero small{opacity:.8;text-transform:uppercase;letter-spacing:.12em}.hero strong{display:block;font-size:clamp(2.2rem,7vw,4rem);line-height:1;margin:10px 0}.metric{padding:20px;background:var(--card);border:1px solid var(--line)}.label{display:inline-block;padding:8px 11px;margin-bottom:20px;border-radius:11px;font-size:.85rem}.metric strong{display:block;font-size:clamp(1.7rem,4vw,2.5rem)}.detail{margin-top:9px;font-size:.82rem}.panel{background:var(--card);border:1px solid var(--line);padding:18px}.calhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;text-align:center}.nav,.btn{border:0;border-radius:11px;cursor:pointer;font-weight:700}.nav{width:42px;height:42px;font-size:1.4rem;color:#0b5f59;background:var(--soft)}.tools{display:flex;justify-content:center;align-items:end;gap:10px;flex-wrap:wrap;margin:16px 0}.days{display:grid;gap:4px;color:var(--muted);font-size:.78rem;font-weight:700}.days span{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--card)}.days input{width:66px;border:0;background:transparent;color:var(--text);font-weight:800}.btn{padding:11px 14px;color:#fff;background:var(--accent)}.btn.alt{color:#0b5f59;background:var(--soft)}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekdays b{text-align:center;padding:6px;color:var(--muted);font-size:.74rem}.day{min-height:108px;padding:9px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.day.empty{border-color:transparent;background:transparent}.day.today{border:2px solid var(--accent)}.daytop,.row,footer{display:flex;justify-content:space-between;gap:6px}.week{padding:3px 6px;font-size:.67rem}.info{display:grid;gap:5px;margin-top:10px;font-size:.73rem}.row strong{font-variant-numeric:tabular-nums}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);background:#17212b;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}footer{margin-top:14px;font-size:.8rem}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.hero{grid-column:1/-1}}@media(max-width:650px){.summary{grid-template-columns:1fr}.status{display:none}.panel{padding:11px}.weekdays,.grid{gap:4px}.day{min-height:88px;padding:6px}.row{display:grid}.row span{font-size:.62rem}.row strong{font-size:.66rem}}@media(prefers-color-scheme:dark){:root{--bg:#071217;--card:#102128;--text:#edf5f6;--muted:#9bb0b7;--line:#20343b;--soft:rgba(15,118,110,.18)}body{background:#071217}.status,.label,.week,.nav,.btn.alt{color:#8de3da}}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand"><div class="logo">LS</div><div><h1>LoteSUB</h1><p>Consulta diaria y calendario de lotes julianos</p></div></div><span class="status">Datos automáticos</span></header>
<section class="summary"><article class="hero"><small>Fecha de hoy</small><strong id="today">--/--/----</strong><p id="todayLong">Cargando…</p></article><article class="metric"><span class="label">Lote del día</span><strong id="lot">---/--</strong><p class="detail" id="lotDetail"></p></article><article class="metric"><span class="label">Semana del año</span><strong id="week">--</strong><p class="detail">Semana ISO</p></article><article class="metric"><span class="label">Fecha de vencimiento</span><strong id="expiry">--/--/----</strong><p class="detail" id="expiryDetail"></p></article></section>
<section class="panel"><div class="calhead"><button class="nav" id="prev" aria-label="Mes anterior">‹</button><div><h2 id="title">Mes actual</h2><p class="sub">Lote, vencimiento y semana ISO</p></div><button class="nav" id="next" aria-label="Mes siguiente">›</button></div><div class="tools"><label class="days">Días para vencimiento<span><input id="days" type="number" min="0" max="999" value="15"> días corridos</span></label><button class="btn alt" id="now">Volver al mes actual</button><button class="btn" id="copy">Copiar datos de hoy</button></div><div class="weekdays"><b>Lun</b><b>Mar</b><b>Mié</b><b>Jue</b><b>Vie</b><b>Sáb</b><b>Dom</b></div><div class="grid" id="grid"></div><footer><span id="summary"></span><span id="updated"></span></footer></section></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),pad=(n,l=2)=>String(n).padStart(l,'0'),fmt=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`,short=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${pad(d.getFullYear()%100)}`;function doy(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000)}function week(d){const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),x=u.getUTCDay()||7;u.setUTCDate(u.getUTCDate()+4-x);return Math.ceil((((u-new Date(Date.UTC(u.getUTCFullYear(),0,1)))/86400000)+1)/7)}function lot(d){return `${pad(doy(d),3)}-${pad(d.getFullYear()%100)}`}function saved(){try{const n=+localStorage.getItem('lotesub-days');return Number.isInteger(n)&&n>=0&&n<=999?n:15}catch{return 15}}let days=saved(),today=new Date(),view=new Date(today.getFullYear(),today.getMonth(),1),data;today=new Date(today.getFullYear(),today.getMonth(),today.getDate());$('days').value=days;function calc(){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate()),e=new Date(d);e.setDate(e.getDate()+days);data={date:fmt(d),lot:lot(d),week:pad(week(d)),expiry:fmt(e)};$('today').textContent=data.date;$('todayLong').textContent=new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);$('lot').textContent=data.lot;$('lotDetail').textContent=`Día juliano ${pad(doy(d),3)} · año ${d.getFullYear()}`;$('week').textContent=data.week;$('expiry').textContent=data.expiry;$('expiryDetail').textContent=`${days} ${days===1?'día corrido':'días corridos'} desde la fecha actual`;$('updated').textContent=`Actualizado ${n.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`}
function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),lead=(first.getDay()+6)%7,g=$('grid');g.innerHTML='';$('title').textContent=new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(view);$('summary').textContent=`${last.getDate()} días · semanas ${pad(week(first))} a ${pad(week(last))}`;for(let i=0;i<lead;i++){const x=document.createElement('div');x.className='day empty';g.appendChild(x)}for(let n=1;n<=last.getDate();n++){const d=new Date(y,m,n),e=new Date(d);e.setDate(e.getDate()+days);const x=document.createElement('article');x.className='day'+(d.toDateString()===today.toDateString()?' today':'');x.innerHTML=`<div class="daytop"><strong>${n}</strong><span class="week">S${pad(week(d))}</span></div><div class="info"><div class="row"><span>Lote</span><strong>${lot(d)}</strong></div><div class="row"><span>Venc.</span><strong>${short(e)}</strong></div></div>`;g.appendChild(x)}}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function apply(){let n=parseInt($('days').value,10);days=Number.isInteger(n)?Math.min(999,Math.max(0,n)):15;$('days').value=days;try{localStorage.setItem('lotesub-days',days)}catch{}calc();render();toast('Vencimiento actualizado')}$('days').addEventListener('change',apply);$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('now').onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);render()};$('copy').onclick=async()=>{calc();const t=`Fecha de hoy: ${data.date}\nLote del día: ${data.lot}\nSemana del año: ${data.week}\nFecha de vencimiento: ${data.expiry}\nDías configurados: ${days}`;try{await navigator.clipboard.writeText(t);toast('Datos copiados')}catch{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Datos copiados')}};calc();render();setInterval(calc,60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
